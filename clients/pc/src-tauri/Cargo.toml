[workspace]

[package]
name = "atlas-bot-pc"
version = "0.1.0"
description = "atlas-bot P2 PC bot_client (Tauri 2 shell)"
authors = ["zyfg9701"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "atlas_bot_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
http = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
