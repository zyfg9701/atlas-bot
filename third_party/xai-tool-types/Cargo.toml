[package]
license = "Apache-2.0"
name = "xai-tool-types"
version = "0.1.0"
edition = "2024"
description = "Canonical tool-description types (vendored for atlas-bot)"

[features]
prompt-render = ["dep:minijinja"]

[dependencies]
minijinja = { version = "2", features = ["custom_syntax"], optional = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
