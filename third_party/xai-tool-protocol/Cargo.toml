[package]
license = "Apache-2.0"
name = "xai-tool-protocol"
version = "0.1.0"
edition = "2024"
description = "Wire-protocol types for the xAI Computer Hub (vendored for atlas-bot)"

[dependencies]
xai-tool-types = { path = "../xai-tool-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
typeshare = "1"
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
