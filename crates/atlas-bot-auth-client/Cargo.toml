[package]
name = "atlas-bot-auth-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "I2/W1 OIDC + WeCom ticket client helpers (PC/CLI shared)"

[[bin]]
name = "mock-oidc"
path = "src/bin/mock-oidc.rs"

[[bin]]
name = "mock-wecom"
path = "src/bin/mock-wecom.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
dirs = "6"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
