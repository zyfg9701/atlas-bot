[package]
name = "atlas-bot-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Gateway backends: stub, CLI (P3.5 B), OpenAI-compat, R1 box sidecar"

[[bin]]
name = "atlas-bot-gateway"
path = "src/bin/atlas-bot-gateway.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "process", "io-util"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
xai-tool-protocol = { path = "../../third_party/xai-tool-protocol" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
