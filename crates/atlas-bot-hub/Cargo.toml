[package]
name = "atlas-bot-hub"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Computer Hub Bot-Relay WebSocket MVP (P3)"

[[bin]]
name = "atlas-bot-hub"
path = "src/bin/atlas-bot-hub.rs"

[[bin]]
name = "mint-jwt"
path = "src/bin/mint-jwt.rs"

[dependencies]
atlas-bot-gateway = { path = "../atlas-bot-gateway" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
xai-tool-protocol = { path = "../../third_party/xai-tool-protocol" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
url = "2"
http = "1"
